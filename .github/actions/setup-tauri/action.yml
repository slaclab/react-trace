name: Set up Tauri build
description: >-
  Installs what building or testing the Tauri desktop app needs: the Linux
  WebView system packages, pnpm and Node with the frontend dependencies, the
  Rust toolchain and build cache, and optionally the bundled Canopy config.
  Run actions/checkout first; a local action is only there after checkout.

inputs:
  node:
    description: Set up pnpm and Node, and run pnpm install.
    default: "true"
  rust-toolchain:
    description: Toolchain for dtolnay/rust-toolchain, e.g. stable or 1.93.1.
    default: stable
  rust-cache:
    description: Cache the src-tauri Cargo build with swatinem/rust-cache.
    default: "true"
  stage-config:
    description: >-
      Copy src-tauri/config.json.example to src-tauri/config.json, the bundle
      resource release builds need.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Linux WebView system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.0-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Setup pnpm
      if: inputs.node == 'true'
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        run_install: false

    - name: Setup Node with pnpm cache
      if: inputs.node == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 23.11.0
        cache: pnpm

    - name: Install Rust toolchain
      # dtolnay/rust-toolchain publishes a `stable` branch (not a tag); pinned
      # by SHA per this repo's convention. The toolchain input picks the
      # version.
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: ${{ inputs.rust-toolchain }}

    - name: Cache Rust build
      if: inputs.rust-cache == 'true'
      uses: swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
      with:
        workspaces: src-tauri

    - name: Install pnpm dependencies
      if: inputs.node == 'true'
      shell: bash
      run: pnpm install

    - name: Stage runtime Canopy config
      if: inputs.stage-config == 'true'
      # config.json is gitignored (it can hold an API key); the bundled default
      # is the committed example. Operators repoint via env/CLI at runtime.
      shell: bash
      run: cp src-tauri/config.json.example src-tauri/config.json
