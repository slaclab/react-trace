version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # package.json and pnpm-lock.yaml. Minor and patch updates share one PR;
  # each major version gets its own, so one breaking major doesn't hold up the rest.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # pyproject.toml and uv.lock, which only build the docs site (gh-pages.yml).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Base images in docker/Dockerfile: node for the build stage, nginx for the image that serves the app.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns:
          - "*"

  # When the Tauri desktop app (#72) lands, add a cargo entry for /src-tauri.
