name: Build Release Artifact

# On a published GitHub release, build the Linux RPM (version stamped from the
# tag) and attach it to the release. This workflow only builds and publishes;
# deploys to the facility servers live in the internal
# slaclab/swapps-sf-deployment repo, which pulls this RPM by release tag.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 23.11.0
          cache: pnpm
      - run: pnpm install

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain publishes a `stable` branch (not a tag); pinned
        # by SHA per this repo's convention. Toolchain pinned for reproducibility.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1

      - name: Install Linux WebView system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev

      - name: Stage runtime Canopy config
        # config.json is gitignored (it can hold an API key); the bundled default
        # is the committed example. Operators repoint via env/CLI at runtime.
        run: cp src-tauri/config.json.example src-tauri/config.json

      - name: Compute version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Tauri RPM
        uses: tauri-apps/tauri-action@42e9df6c59070d114bf90dcd3943a1b8f138b113 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --bundles rpm
            --config {"package":{"version":"${{ steps.ver.outputs.version }}"}}

      - name: Attach RPM to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: src-tauri/target/release/bundle/rpm/*.rpm
