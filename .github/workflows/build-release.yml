name: Build Release Artifact

# On a published GitHub release, build the Linux RPM (version stamped from the
# tag) and attach it to the release. This workflow only builds and publishes;
# deploys live in an internal deploy repo, which pulls this RPM by release
# tag.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    # build-dev.yml's dev-<sha> and dev-latest prereleases are published
    # releases too. They're created with GITHUB_TOKEN, which doesn't start
    # workflows, but a token change or one published by hand would otherwise
    # build here and attach a second RPM to dev-latest.
    if: ${{ !startsWith(github.event.release.tag_name, 'dev-') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Compute version from tag
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name }}
        # The RPM version comes from the tag (v1.2.3 or 1.2.3), so anything
        # that isn't semver stops here instead of reaching the Tauri build.
        run: |
          version=${TAG#v}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag $TAG isn't a version like v1.2.3; not building an RPM."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Tauri build
        uses: ./.github/actions/setup-tauri
        with:
          # Pinned for reproducible release artifacts.
          rust-toolchain: 1.93.1
          # Release RPMs are built from a clean target directory rather than
          # one restored from a cache written by an earlier run.
          rust-cache: false
          stage-config: true

      - name: Build Tauri RPM
        uses: tauri-apps/tauri-action@42e9df6c59070d114bf90dcd3943a1b8f138b113 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --bundles rpm
            --config {"package":{"version":"${{ steps.ver.outputs.version }}"}}

      - name: Attach RPM to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: src-tauri/target/release/bundle/rpm/*.rpm
