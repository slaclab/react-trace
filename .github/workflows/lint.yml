name: Lint & Format

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: slaclab/swapps-ci-helpers/.github/workflows/js-check.yml@9bd3f16145f87d30ed28c044c8e51121529840e0
    with:
      node-version: "23.11.0"
      check-command: "pnpm run lint && pnpm run format:check && pnpm run typecheck"
