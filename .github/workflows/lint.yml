name: Lint & Format

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: slaclab/swapps-ci-helpers/.github/workflows/js-check.yml@afaac9fd67e0b31c887a48c19d9a6b219ea72a8f
    with:
      node-version: "23.11.0"
      check-command: "pnpm run lint && pnpm run format:check && pnpm run typecheck"
