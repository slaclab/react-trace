name: Lint & Format

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: slaclab/swapps-ci-helpers/.github/workflows/js-check.yml@ab0c25cb9b7ee308b967e43bcd885ed15b179b1f
    with:
      node-version: "23.11.0"
      check-command: "pnpm run lint && pnpm run format:check && pnpm run typecheck"
