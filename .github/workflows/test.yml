name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: slaclab/swapps-ci-helpers/.github/workflows/js-test.yml@afaac9fd67e0b31c887a48c19d9a6b219ea72a8f

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The @perf specs time the main thread and need a quiet machine; they run
      # locally with `pnpm test:e2e --grep @perf`.
      - name: Run browser tests
        run: pnpm test:e2e --grep-invert @perf
