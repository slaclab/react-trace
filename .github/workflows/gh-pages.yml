# This workflow will publish a new version of the documentation to the gh-pages branch

name: Build & Deploy Documentation
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "zensical.toml"
      - "mkdocs.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: slaclab/swapps-ci-helpers/.github/workflows/docs.yml@9bd3f16145f87d30ed28c044c8e51121529840e0
