name: Build and publish container image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build and publish GHCR image
    uses: slaclab/swapps-ci-helpers/.github/workflows/build-ghcr-image.yml@73e6ba924aac5f822b050bd6bed12b0e45c64034 # v1.1.0
    permissions:
      contents: read
      packages: write
    with:
      # The deployment's own feedback form and docs site, from repository
      # variables. Unset, the app links this repo's issues and public docs.
      build-args: |
        VITE_BUG_REPORT_URL=${{ vars.BUG_REPORT_URL }}
        VITE_DOCS_URL=${{ vars.DOCS_URL }}
      dockerfile: docker/Dockerfile
      context: .
      # Tag main builds with the bare short SHA (plus latest), as canopy and
      # canopy-screen-builder do. Deploying is up to the deployment repo: it
      # pulls one of these tags.
      sha-tag-prefix: ''
