name: Build Dev RPM

# On every push to main: build the Linux RPM and publish it as an immutable
# dev-<7-char sha> prerelease plus a rolling dev-latest prerelease. This
# workflow only builds and publishes. The DEV deploy lives in an internal
# deploy repo, whose scheduled autodeploy picks the newest dev-[0-9a-f]*
# prerelease and its trace-*.x86_64.rpm asset.
#
# Two jobs:
# - build: one per push, never cancelled. Publishes dev-<sha>; a rerun keeps
#   the RPM already published there (overwrite_files: false).
# - publish-latest: serialized across runs (concurrency group). Moves dev-latest
#   forward only: a build whose commit is older than the one dev-latest already
#   points at is skipped. It copies the RPM from dev-<sha>, moves the tag, and
#   leaves exactly that one RPM on the release.
#   GitHub keeps at most one pending job per concurrency group, so when several
#   publishes overlap the queued one can be cancelled (shown as a cancelled run
#   on main). If that was the newest commit, dev-latest lags until the next push
#   to main; the per-commit dev-<sha> releases are unaffected.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      rpm_name: ${{ steps.find-rpm.outputs.rpm_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set release tag
        id: vars
        run: echo "release_tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 23.11.0
          cache: pnpm
      - run: pnpm install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1

      - name: Install Linux WebView system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev

      - name: Stage runtime Canopy config
        run: cp src-tauri/config.json.example src-tauri/config.json

      - name: Build Tauri RPM
        uses: tauri-apps/tauri-action@42e9df6c59070d114bf90dcd3943a1b8f138b113 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles rpm

      - name: Find RPM file
        id: find-rpm
        # The asset name (trace-<version>-1.x86_64.rpm, version from
        # tauri.conf.json) is what the deploy repo matches, so fail rather
        # than publish anything else.
        run: |
          shopt -s nullglob
          RPMS=(src-tauri/target/release/bundle/rpm/trace-*.x86_64.rpm)
          if [ "${#RPMS[@]}" -ne 1 ]; then
            echo "::error::Expected one trace-*.x86_64.rpm, found ${#RPMS[@]}"
            exit 1
          fi
          echo "rpm_path=${RPMS[0]}" >> "$GITHUB_OUTPUT"
          echo "rpm_name=$(basename "${RPMS[0]}")" >> "$GITHUB_OUTPUT"
          echo "Found RPM: $(basename "${RPMS[0]}")"

      - name: Create immutable dev-<sha> pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: ${{ steps.vars.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ steps.find-rpm.outputs.rpm_path }}
          # A rerun finds this release already published: keep its RPM rather
          # than deleting and replacing it with a rebuild.
          overwrite_files: false
          body: |
            Dev build from main branch.
            Commit: ${{ github.sha }}
            Built: ${{ github.event.head_commit.timestamp }}

  publish-latest:
    needs: build
    runs-on: ubuntu-22.04
    concurrency:
      group: dev-latest-release
      cancel-in-progress: false
    steps:
      - name: Update dev-latest rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RPM_NAME: ${{ needs.build.outputs.rpm_name }}
          BUILT: ${{ github.event.head_commit.timestamp }}
        # No checkout here, so every gh release call names the repo.
        run: |
          set -euo pipefail

          # Only move dev-latest forward. "behind" means this commit is an
          # ancestor of the one dev-latest points at: a newer push already
          # published, so this build is stale. "diverged" (main rewritten)
          # publishes. With no tag yet there is nothing to compare.
          if gh api "repos/$REPO/git/ref/tags/dev-latest" --silent 2>/dev/null; then
            status=$(gh api "repos/$REPO/compare/dev-latest...$SHA" --jq .status)
            echo "dev-latest...${SHA::7}: $status"
            if [ "$status" = behind ]; then
              echo "::notice::dev-latest already points at a newer commit than ${SHA::7}; not publishing."
              exit 0
            fi
            tag_exists=true
          else
            tag_exists=false
          fi

          # Same bytes as the immutable per-commit release, including on reruns.
          workdir=$(mktemp -d)
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern "$RPM_NAME" --dir "$workdir"

          # Move the tag first: updating a release doesn't move its tag, and
          # the release's source archives come from the tag.
          if [ "$tag_exists" = true ]; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/dev-latest" -f sha="$SHA" -F force=true --silent
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/dev-latest -f sha="$SHA" --silent
          fi

          notes="Rolling dev build from main branch.
          Points at: $RELEASE_TAG
          Commit: $SHA
          Built: $BUILT"
          if gh release view dev-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release edit dev-latest --repo "$REPO" --title "Dev Latest" --prerelease \
              --target "$SHA" --notes "$notes"
          else
            gh release create dev-latest --repo "$REPO" --verify-tag --title "Dev Latest" \
              --prerelease --notes "$notes"
          fi

          # Upload first so the release is never empty, then remove every
          # other asset (e.g. the previous version's RPM after a version bump).
          gh release upload dev-latest "$workdir/$RPM_NAME" --repo "$REPO" --clobber
          gh release view dev-latest --repo "$REPO" --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ "$name" != "$RPM_NAME" ]; then
                gh release delete-asset dev-latest "$name" --repo "$REPO" --yes
              fi
            done
