name: Build Dev RPM

# On every push to main: build the Linux RPM and publish it as an immutable
# dev-<7-char sha> prerelease plus a rolling dev-latest prerelease. This
# workflow only builds and publishes. The DEV deploy lives in the internal
# slaclab/swapps-sf-deployment repo, whose scheduled autodeploy picks the newest
# dev-[0-9a-f]* prerelease and its trace-*.x86_64.rpm asset.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set release tag
        id: vars
        run: echo "release_tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 23.11.0
          cache: pnpm
      - run: pnpm install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1

      - name: Install Linux WebView system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev

      - name: Stage runtime Canopy config
        run: cp src-tauri/config.json.example src-tauri/config.json

      - name: Build Tauri RPM
        uses: tauri-apps/tauri-action@42e9df6c59070d114bf90dcd3943a1b8f138b113 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles rpm

      - name: Find RPM file
        id: find-rpm
        # The asset name (trace-<version>-1.x86_64.rpm, version from
        # tauri.conf.json) is what swapps-sf-deployment matches, so fail rather
        # than publish anything else.
        run: |
          shopt -s nullglob
          RPMS=(src-tauri/target/release/bundle/rpm/trace-*.x86_64.rpm)
          if [ "${#RPMS[@]}" -ne 1 ]; then
            echo "::error::Expected one trace-*.x86_64.rpm, found ${#RPMS[@]}"
            exit 1
          fi
          echo "rpm_path=${RPMS[0]}" >> "$GITHUB_OUTPUT"
          echo "Found RPM: $(basename "${RPMS[0]}")"

      - name: Create immutable dev-<sha> pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: ${{ steps.vars.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ steps.find-rpm.outputs.rpm_path }}
          body: |
            Dev build from main branch.
            Commit: ${{ github.sha }}
            Built: ${{ github.event.head_commit.timestamp }}

      - name: Update dev-latest rolling pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: dev-latest
          name: Dev Latest
          prerelease: true
          files: ${{ steps.find-rpm.outputs.rpm_path }}
          body: |
            Rolling dev build from main branch.
            Points at: ${{ steps.vars.outputs.release_tag }}
            Commit: ${{ github.sha }}
            Built: ${{ github.event.head_commit.timestamp }}
