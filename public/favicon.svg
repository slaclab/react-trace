<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Favicon variant of app-icon.svg: same palette and motif, simplified and
       bolded so it survives 16-32px rendering (no grid/garnish, thicker traces). -->
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="traceAccent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f62fe"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="warmAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glowDot">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <clipPath id="clip">
    <rect width="1024" height="1024" rx="200" ry="200"/>
  </clipPath>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <radialGradient id="radHighlight" cx="45%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <rect width="1024" height="1024" fill="url(#radHighlight)"/>

    <!-- Warm secondary trace -->
    <polyline
      points="170,560 330,600 470,530 610,575 750,505 854,530"
      fill="none"
      stroke="url(#warmAccent)"
      stroke-width="46"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.6"
    />

    <!-- Hero trace + live dot -->
    <polyline
      points="170,760 330,660 450,710 600,480 700,540 854,330"
      fill="none"
      stroke="url(#traceAccent)"
      stroke-width="68"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#glowDot)"
    />
    <circle cx="854" cy="330" r="84" fill="#38bdf8" opacity="0.15"/>
    <circle cx="854" cy="330" r="48" fill="#7dd3fc" filter="url(#glowDot)"/>
  </g>
</svg>
