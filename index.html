<!doctype html>
<!-- Dark (g100) until main.tsx applies the stored color mode, so the first
     paint isn't a white flash for the default dark theme. Keep it matching
     TRACE_COLOR_MODE.defaultMode in src/state/colorMode.ts;
     src/state/colorMode.test.ts fails if the two drift apart. -->
<html lang="en" class="cds--g100" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
