<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background (matches the elog-plus app family) -->
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Cool primary accent: Trace's Carbon blue, lifted toward cyan -->
    <linearGradient id="traceAccent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f62fe"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- Warm echo of the elog accent, for the secondary curve -->
    <linearGradient id="warmAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <!-- Chart panel surface -->
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3b53"/>
      <stop offset="100%" stop-color="#1d293e"/>
    </linearGradient>
    <!-- Area fill under the hero trace -->
    <linearGradient id="areaFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <!-- Shadow -->
    <filter id="sh">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- Glows -->
    <filter id="glowWide">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowDot">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Clip to rounded shape -->
  <clipPath id="iconClip">
    <rect width="1024" height="1024" rx="220" ry="220"/>
  </clipPath>
  <g clip-path="url(#iconClip)">

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Very subtle radial highlight -->
  <radialGradient id="radHighlight" cx="45%" cy="42%" r="40%">
    <stop offset="0%" stop-color="#334155" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
  </radialGradient>
  <rect width="1024" height="1024" fill="url(#radHighlight)"/>

  <!-- Large ambient glow behind the panel -->
  <ellipse cx="512" cy="470" rx="210" ry="200" fill="#38bdf8" opacity="0.05" filter="url(#glowWide)"/>

  <!-- === MAIN CHART PANEL === -->
  <g filter="url(#sh)">
    <rect x="220" y="250" width="584" height="500" rx="36" fill="url(#panel)"/>
  </g>
  <rect x="220" y="250" width="584" height="500" rx="36" fill="none" stroke="#64748b" stroke-width="2.5" opacity="0.3"/>

  <!-- Gridlines -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="284" y1="390" x2="740" y2="390" opacity="0.07"/>
    <line x1="284" y1="480" x2="740" y2="480" opacity="0.07"/>
    <line x1="284" y1="570" x2="740" y2="570" opacity="0.07"/>
    <line x1="396" y1="304" x2="396" y2="686" opacity="0.05"/>
    <line x1="512" y1="304" x2="512" y2="686" opacity="0.05"/>
    <line x1="628" y1="304" x2="628" y2="686" opacity="0.05"/>
  </g>

  <!-- Axes: left (blue ticks) and right (amber ticks) — Trace plots per-axis -->
  <g stroke-linecap="round">
    <line x1="280" y1="300" x2="280" y2="690" stroke="#94a3b8" stroke-width="3" opacity="0.25"/>
    <line x1="744" y1="300" x2="744" y2="690" stroke="#94a3b8" stroke-width="3" opacity="0.18"/>
    <line x1="280" y1="690" x2="744" y2="690" stroke="#94a3b8" stroke-width="3" opacity="0.25"/>
    <line x1="262" y1="390" x2="280" y2="390" stroke="#60a5fa" stroke-width="4" opacity="0.45"/>
    <line x1="262" y1="480" x2="280" y2="480" stroke="#60a5fa" stroke-width="4" opacity="0.35"/>
    <line x1="262" y1="570" x2="280" y2="570" stroke="#60a5fa" stroke-width="4" opacity="0.25"/>
    <line x1="744" y1="420" x2="762" y2="420" stroke="#f59e0b" stroke-width="4" opacity="0.4"/>
    <line x1="744" y1="510" x2="762" y2="510" stroke="#f59e0b" stroke-width="4" opacity="0.3"/>
    <line x1="744" y1="600" x2="762" y2="600" stroke="#f59e0b" stroke-width="4" opacity="0.2"/>
  </g>

  <!-- Crosshair readout at the live sample -->
  <g stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 14" stroke-linecap="round">
    <line x1="700" y1="306" x2="700" y2="684" opacity="0.16"/>
    <line x1="286" y1="330" x2="738" y2="330" opacity="0.1"/>
  </g>

  <!-- Secondary curve: warm echo of the elog accent -->
  <polyline
    points="280,478 360,500 430,452 500,486 570,438 640,462 700,414"
    fill="none"
    stroke="url(#warmAccent)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.55"
  />
  <circle cx="700" cy="414" r="9" fill="#f59e0b" opacity="0.6"/>

  <!-- Hero trace: area fill, glowing line, live sample dot -->
  <path
    d="M 280,600 L 350,558 415,584 480,468 545,504 610,392 660,428 700,330 L 700,690 280,690 Z"
    fill="url(#areaFade)"
  />
  <polyline
    points="280,600 350,558 415,584 480,468 545,504 610,392 660,428 700,330"
    fill="none"
    stroke="url(#traceAccent)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glowDot)"
  />
  <circle cx="700" cy="330" r="34" fill="#38bdf8" opacity="0.12"/>
  <circle cx="700" cy="330" r="24" fill="none" stroke="#38bdf8" stroke-width="3.5" opacity="0.35"/>
  <circle cx="700" cy="330" r="15" fill="#7dd3fc" filter="url(#glowDot)"/>

  <!-- === FLOATING ELEMENTS === -->
  <!-- Accent ring top right -->
  <circle cx="838" cy="192" r="28" fill="url(#traceAccent)" opacity="0.08"/>
  <circle cx="838" cy="192" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.12"/>

  <!-- Small dots constellation -->
  <circle cx="180" cy="175" r="4" fill="#38bdf8" opacity="0.2"/>
  <circle cx="200" cy="160" r="2.5" fill="#7dd3fc" opacity="0.15"/>
  <circle cx="168" cy="152" r="1.5" fill="#f59e0b" opacity="0.12"/>

  <!-- Bottom left accent -->
  <circle cx="186" cy="835" r="20" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.08"/>

  <!-- Live-signal badge bottom right -->
  <g transform="translate(828, 772)" opacity="0.2">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
  </g>

  </g><!-- close iconClip -->
</svg>
